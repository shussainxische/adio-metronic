<div class="flex justify-between gap-4">
  <div class="flex gap-3">
    <!-- Icon -->
    <div *ngIf="icon" class="flex-shrink-0">
      <ng-container [ngSwitch]="icon">
        <svg *ngSwitchCase="'success'" class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <svg *ngSwitchCase="'error'" class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <svg *ngSwitchCase="'warning'" class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <svg *ngSwitchCase="'info'" class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </ng-container>
    </div>

    <!-- Message content -->
    <div>
      <div class="text-primary-on-surface">{{ message }}</div>
      <span *ngIf="subMessage">{{ subMessage }}</span>
    </div>
  </div>

  <div class="flex gap-2 self-end flex-wrap">
    <button
      *ngFor="let action of actions"
      class="text-blue2 text-start break-keep"
      (click)="onActionClick(action.id)">
      {{ action.label }}
    </button>
  </div>
</div>
