<div class="flex flex-col">
  <ng-container *ngIf="label">
    <label
      class="block mb-2 text-base font-normal"
      [ngClass]="{
        'text-xs': size === 'small',
        'text-base': size === 'medium' || size === 'large',
        'text-red': hasError,
        'text-gray-700': !hasError
      }"
    >
      {{ label | translate }}
      <span *ngIf="isMandatory" class="text-red-500">*</span>
    </label>
  </ng-container>

  <div class="relative h-[46px]">
    <app-select
      [control]="control"
      [options]="options"
      [placeholder]="placeholder | translate"
      [disabled]="disabled || isLoading"
      (change)="onClick()"
    >
    </app-select>
    <app-loader
      *ngIf="isLoading"
      [inline]="true"
      [size]="'md'"
      class="flex absolute end-8 top-1/2 transform -translate-y-1/2"
    ></app-loader>
  </div>
</div>
<div *ngIf="hasError && control?.touched" class="text-red text-sm mt-1">
  <ng-container *ngIf="errorMessage">{{
    errorMessage | translate
  }}</ng-container>
</div>
