<div class="flex flex-col items-center py-10">
  <div class="text-gray-900 font-semibold">{{ title | translate }}</div>
  <div *ngIf="description">
    <div class="text-sm text-gray-800 mt-1" *appHasPermission="permissions">
      {{ description | translate }}
    </div>
  </div>
  <div *ngIf="unauthorizedDescription">
    <div class="text-sm text-gray-800 mt-1" *appHasNoPermission="permissions">
      {{ unauthorizedDescription | translate }}
    </div>
  </div>
  <div>
    <div class="flex" *ngIf="buttonLabel">
      <app-adio-button
        class="mt-4"
        mode="filled"
        (click)="onButtonClick()"
        *appHasPermission="permissions"
      >
        <span class="material-symbols-outlined text-2xl" iconBefore>add</span>
        {{ buttonLabel | translate }}
      </app-adio-button>
    </div>
  </div>
</div>
