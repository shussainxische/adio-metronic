<div class="widget-container">
  <div class="widget-header">
    <h3 class="widget-title">{{ title }}</h3>
  </div>
  
  <div class="widget-content">
    <div class="summary-item">
      <span class="label">Application ID:</span>
      <span class="value">{{ data.applicationId }}</span>
    </div>
    
    <div class="summary-item">
      <span class="label">Application Date:</span>
      <span class="value">{{ data.applicationDate }}</span>
    </div>
    
    <div class="summary-item">
      <span class="label">Company:</span>
      <span class="value">{{ data.company }}</span>
    </div>
    
    <div class="summary-item">
      <span class="label">Type:</span>
      <span class="value">{{ data.type }}</span>
    </div>
    
    <div class="summary-item">
      <span class="label">Services:</span>
      <div class="services-list">
        <span *ngFor="let service of data.services" class="service-tag">{{ service }}</span>
      </div>
    </div>
    
    <div class="summary-item">
      <span class="label">Assigned To:</span>
      <span class="value">{{ data.assignedTo }}</span>
    </div>
    
    <div class="summary-item">
      <span class="label">Progress:</span>
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="data.progress"></div>
        </div>
        <span class="progress-text">{{ data.progress }}%</span>
      </div>
    </div>
    
    <div class="summary-item">
      <span class="label">Status:</span>
      <span class="status-badge" [ngClass]="'status-' + data.statusVariant">{{ data.status }}</span>
    </div>
  </div>
</div>
