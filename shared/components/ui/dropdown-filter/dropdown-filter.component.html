<ng-container *ngIf="label">
  <label class="block mb-2 text-base font-normal text-gray-700">
    {{ label | translate }}
    <span *ngIf="isMandatory" class="text-red-500">*</span>
  </label>
</ng-container>
<div
  #parentWrapper
  class="relative min-w-[150px] w-full h-full"
  [class]="className"
>
  <div class="relative w-full h-full" #menuDropdownWrapper>
    <app-menu-dropdown #menuDropdown>
      <!-- Trigger -->
      <div
        class="relative w-full cursor-pointer menu-toggle h-full"
        [class.pointer-events-none]="disabled"
        [class.opacity-50]="disabled"
        (click)="toggleDropdown()"
      >
        <div
          [ngClass]="
            selectedItems?.length > 0 ? 'border-gray-800' : 'border-gray-700'
          "
          class="flex items-center justify-between w-full h-full border rounded-md ps-4 pe-2 py-3"
        >
          <div class="flex items-center gap-1 h-full w-full">
            <!-- Show placeholder when nothing selected -->
            <span
              *ngIf="selectedItems?.length == 0"
              class="text-gray-800 text-sm flex-1 pe-7"
            >
              {{ placeholder | translate }}
            </span>

            <!-- Show count for checkbox mode -->
            <div
              *ngIf="useCheckboxes && selectedItems?.length > 0"
              class="flex items-center gap-1 flex-1"
            >
              <div
                class="flex items-center justify-center w-5 h-5 text-xs rounded-full bg-surface-active-status text-gray-800"
              >
                {{ selectedItems?.length }}
              </div>
              <span class="text-sm text-gray-800">Selected</span>
            </div>

            <!-- Show selected item label for non-checkbox mode -->
            <span
              *ngIf="!useCheckboxes && selectedItems?.length > 0"
              class="text-gray-800 text-sm flex-1"
            >
              {{ getSelectedLabel() }}
            </span>

            <span
              class="absolute inset-y-0 end-0 flex items-center pe-4 pointer-events-none"
              *ngIf="selectedItems?.length === 0"
            >
              <i class="ki-outline ki-down fs-7 text-gray-600"></i>
            </span>
            <span *ngIf="selectedItems?.length > 0">
              <i class="ki-outline ki-down fs-7 text-gray-600"></i>
            </span>

            <ng-container *ngIf="selectedItems?.length > 0">
              <div class="w-[1px] h-[20px] bg-surface-active-status"></div>
              <div (click)="clearSelections($event)" class="cursor-pointer">
                <span class="material-symbols-outlined text-lg">close</span>
              </div>
            </ng-container>
          </div>
        </div>
      </div>

      <!-- Dropdown with style binding for initial width -->
      <app-dropdown-wrapper [style.min-width]="dropdownWidth">
        <div class="" *ngIf="options.length > 2 || !localFiltering">
          <div class="relative w-full px-4 h-[42px] mb-4">
            <app-input
              [control]="searchControl"
              [placeholder]="'common.search' | translate"
              inputClass="text-sm leading-[20px] tracking-[0.25px] font-normal bg-transparent"
              class="w-full rounded-md"
            >
              <div iconBefore class="ps-3 pe-1 flex items-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                >
                  <path
                    d="M11.8162 10.6914H11.2237L11.0137 10.4889C11.7487 9.63391 12.1912 8.52391 12.1912 7.31641C12.1912 4.62391 10.0087 2.44141 7.31616 2.44141C4.62366 2.44141 2.44116 4.62391 2.44116 7.31641C2.44116 10.0089 4.62366 12.1914 7.31616 12.1914C8.52366 12.1914 9.63366 11.7489 10.4887 11.0139L10.6912 11.2239V11.8164L14.4412 15.5589L15.5587 14.4414L11.8162 10.6914ZM7.31616 10.6914C5.44866 10.6914 3.94116 9.18391 3.94116 7.31641C3.94116 5.44891 5.44866 3.94141 7.31616 3.94141C9.18366 3.94141 10.6912 5.44891 10.6912 7.31641C10.6912 9.18391 9.18366 10.6914 7.31616 10.6914Z"
                    fill="#464646"
                  />
                </svg>
              </div>
            </app-input>
          </div>

          <div class="mt-4" *ngIf="showAllOption && useCheckboxes">
            <app-menu-item
              [checkable]="true"
              [class]="'mb-2'"
              [checked]="selectedItems?.length === options?.length"
              [label]="'common.all' | translate"
              (checkChange)="
                selectedItems?.length === options?.length
                  ? clearSelections()
                  : selectAll()
              "
            >
            </app-menu-item>
          </div>
        </div>

        <!-- Menu Items inside the dropdown with scroll event -->
        <div
          class="flex flex-col max-h-[280px] overflow-y-auto gap-2"
          (scroll)="onScroll($event)"
        >
          <!-- Both checkbox and non-checkbox modes -->
          <app-menu-item
            *ngFor="let option of filteredOptions"
            [checkable]="useCheckboxes"
            [checked]="isSelected(option.value)"
            [label]="option.label"
            (checkChange)="onOptionChange(option)"
            (itemClick)="onNonCheckboxOptionClick(option)"
          >
          </app-menu-item>

          <!-- Loading indicator -->
          <div
            *ngIf="enableInfiniteScroll && options.length < totalItems"
            class="flex justify-center py-2"
          >
            <app-loader [inline]="true" size="sm"></app-loader>
          </div>
        </div>
        <ng-content select="[dropdownFooter]"></ng-content>

        <div
          class="border-b border-stroke-horizantal-divider mt-2 mx-4"
          *ngIf="showClearAll"
        ></div>

        <div class="py-2 ps-4 mt-3" *ngIf="showClearAll">
          <div
            class="flex items-center gap-2 cursor-pointer"
            (click)="clearSelections()"
          >
            <div class="w-5 h-5 flex items-center justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="none"
                viewBox="0 0 20 20"
              >
                <path
                  d="M5.83325 17.5C5.37492 17.5 4.98256 17.3368 4.65617 17.0104C4.32978 16.684 4.16659 16.2917 4.16659 15.8333V5H3.33325V3.33333H7.49992V2.5H12.4999V3.33333H16.6666V5H15.8333V15.8333C15.8333 16.2917 15.6701 16.684 15.3437 17.0104C15.0173 17.3368 14.6249 17.5 14.1666 17.5H5.83325ZM14.1666 5H5.83325V15.8333H14.1666V5ZM7.49992 14.1667H9.16659V6.66667H7.49992V14.1667ZM10.8333 14.1667H12.4999V6.66667H10.8333V14.1667Z"
                  fill="#464646"
                />
              </svg>
            </div>
            <span
              class="text-gray-800 text-sm leading-[20px] tracking-[0.25px] font-normal"
            >
              {{ "common.clear_all" | translate }}
            </span>
          </div>
        </div>
      </app-dropdown-wrapper>
    </app-menu-dropdown>
  </div>
</div>
<div *ngIf="hasError && control?.touched" class="text-red text-sm mt-1">
  <ng-container *ngIf="errorMessage">{{
    errorMessage | translate
  }}</ng-container>
</div>
