<div class="bg-gray-50 border border-gray-200 rounded-xl p-6 space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-base font-semibold text-gray-900">Summary</h2>
    <app-status-badge
      [text]="data.status"
      [variant]="data.statusVariant"
      size="sm"
      [autoWidth]="true">
    </app-status-badge>
  </div>

  <div class="space-y-3">
    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Application ID</span>
      <span class="text-xs font-semibold text-gray-900">{{ data.applicationId }}</span>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Application Date</span>
      <span class="text-xs font-medium text-gray-900">{{ data.applicationDate }}</span>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Company</span>
      <span class="text-xs font-medium text-gray-900">{{ data.company }}</span>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Type</span>
      <span class="text-xs font-medium text-gray-900">{{ data.type }}</span>
    </div>

    <div class="flex justify-between items-start">
      <span class="text-xs text-gray-600">Services</span>
      <div class="flex gap-1 flex-wrap">
        <span 
          *ngFor="let service of data.services" 
          class="px-2 py-1 bg-gray-200 text-gray-700 text-xs rounded-md font-medium">
          {{ service }}
        </span>
      </div>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Deadline</span>
      <span class="text-xs font-medium text-gray-900">{{ data.deadline }}</span>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Assigned To</span>
      <span class="text-xs font-medium text-gray-900">{{ data.assignedTo }}</span>
    </div>

    <div class="flex justify-between items-start">
      <span class="text-xs text-gray-600">Progress</span>
      <div class="flex flex-col items-end gap-1">
        <span class="text-xs font-semibold text-gray-900">{{ data.progress }}%</span>
        <div class="w-16 bg-gray-200 rounded-full h-1.5">
          <div 
            class="bg-orange-500 h-1.5 rounded-full transition-all duration-300"
            [style.width.%]="data.progress">
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-xs text-gray-600">Current Step</span>
      <span class="text-xs font-medium text-gray-900">{{ data.currentStep }}</span>
    </div>
  </div>
</div>
