<div class="border border-gray-200 rounded-lg bg-white">
  <div 
    class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50 cursor-pointer"
    (click)="toggleCollapse()">
    <h3 class="text-base font-semibold text-gray-900">SLA Compliance</h3>
    <app-icon 
      [name]="getIconName()" 
      [size]="14" 
      [className]="getStatusColor()">
    </app-icon>
  </div>
  
  <div 
    class="transition-all duration-300 ease-in-out overflow-hidden"
    [ngClass]="isCollapsed ? 'max-h-0' : 'max-h-96'">
    <div class="p-4 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-600">SLA Status</span>
        <span [class]="'text-xs font-medium ' + getStatusColor()">
          {{ data.daysLeft }} days left
        </span>
      </div>
      
      <div [class]="'rounded-lg p-3 border ' + getBackgroundColor()">
        <div class="flex items-start gap-2">
          <app-icon 
            [name]="getIconName()" 
            [size]="14" 
            [className]="getStatusColor() + ' mt-0.5 flex-shrink-0'">
          </app-icon>
          <p class="text-xs text-gray-700">{{ data.message }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
