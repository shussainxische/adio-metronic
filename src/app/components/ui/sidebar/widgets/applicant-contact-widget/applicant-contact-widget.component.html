<div class="border border-gray-200 rounded-lg bg-white">
  <div 
    class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50 cursor-pointer"
    (click)="toggleCollapse()">
    <h3 class="text-base font-semibold text-gray-900">Applicant Contact</h3>
    <app-icon 
      [name]="isCollapsed ? 'chevron-down' : 'chevron-up'" 
      [size]="14" 
      className="text-gray-400 transition-transform duration-200">
    </app-icon>
  </div>
  
  <div 
    class="transition-all duration-300 ease-in-out overflow-hidden"
    [ngClass]="isCollapsed ? 'max-h-0' : 'max-h-96'">
    <div class="p-4 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-600">Name</span>
        <span class="text-xs font-medium text-gray-900">{{ data.name }}</span>
      </div>
      
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-600">Position</span>
        <span class="text-xs font-medium text-gray-900">{{ data.position }}</span>
      </div>
      
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-600">Email</span>
        <span class="text-xs font-medium text-gray-900">{{ data.email }}</span>
      </div>
      
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-600">Phone</span>
        <span class="text-xs font-medium text-gray-900">{{ data.phone }}</span>
      </div>
    </div>
  </div>
</div>
