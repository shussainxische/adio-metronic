<div #parentWrapper class="relative">
  <ng-container *ngIf="label">
    <label
      class="block mb-2 text-base font-normal"
      [ngClass]="{
        'text-xs': size === 'small',
        'text-base': size === 'medium' || size === 'large',
        'text-red': hasError,
        'text-gray-700': !hasError
      }"
    >
      {{ label | translate }}
      <span *ngIf="required" class="text-red-500">*</span>
    </label>
  </ng-container>

  <div #menuDropdownWrapper style="position: relative; width: 100%">
    <app-menu-dropdown #menuDropdown [disabled]="disabled">
      <!-- Trigger with focus effect -->
      <div
        [class.cursor-pointer]="!disabled"
        [class.cursor-not-allowed]="disabled"
        [style.min-width]="minWidth"
        class="relative w-full menu-toggle h-full"
        (click)="onTriggerClick($event)"
      >
        <div
          class="flex items-center justify-between w-full border rounded-md group"
          [ngClass]="{
            'border-gray-700': !hasError && !isDropdownOpen,
            'border-primary-light': !hasError && !disabled && isDropdownOpen,
            'border-red': hasError,
            'hover:border-gray-900': !disabled && !hasError && !isDropdownOpen,
            'focus-within:border-primary-light': !disabled && !hasError,
            'active:border-gray-700': !disabled && !hasError,
            'bg-transparent': true,
            'opacity-70': disabled
          }"
          [ngStyle]="
            isDropdownOpen && !hasError
              ? { 'border-color': 'var(--tw-primary-light)' }
              : {}
          "
        >
          <!-- Fixed p-3.5 padding like original -->
          <div
            class="flex items-center gap-1 py-[11px] px-3.5 pe-10 w-full"
            [ngClass]="{
              'py-[8px]': size === 'small',
              'py-[11px]': size === 'medium' || size === 'large',
            }"
          >
            <!-- Selected option icon -->
            <ng-container *ngIf="showIcons && getSelectedOption()">
              <!-- Image icon -->
              <img
                *ngIf="getSelectedOption()?.icon"
                [src]="getSelectedOption()!.icon"
                [class]="'me-2 inline-block rounded-full ' + iconSize"
                [alt]="getOptionDisplayText(getSelectedOption())"
              />
              <!-- CSS class icon -->
              <i
                *ngIf="getSelectedOption()?.iconClass"
                [class]="getSelectedOption()!.iconClass + ' ' + iconSize"
              ></i>
            </ng-container>

            <!-- Show placeholder or selected value -->
            <span
              *ngIf="!control?.value"
              [ngClass]="{
                'text-xs': size === 'small',
                'text-sm': size === 'medium' || size === 'large',
                'text-gray-700': !isDropdownOpen,
                'text-gray-900': isDropdownOpen && !disabled && !hasError
              }"
            >
              {{ placeholder | translate }}
            </span>

            <span
              *ngIf="control?.value"
              [ngClass]="{
                'text-xs': size === 'small',
                'text-sm': size === 'medium' || size === 'large',
                'text-gray-800': !isDropdownOpen,
                'text-gray-900': isDropdownOpen && !disabled && !hasError
              }"
            >
              {{ getSelectedLabel() }}
            </span>
          </div>

          <!-- Dropdown icon -->
          <div
            class="absolute inset-y-0 end-0 flex items-center pointer-events-none"
            [ngClass]="{
              'px-2': size === 'small',
              'px-3': size === 'medium',
              'px-4': size === 'large'
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [ngClass]="{
                'text-gray-700': !hasError && !isDropdownOpen,
                'text-primary-light': !hasError && isDropdownOpen,
                'text-red': hasError
              }"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <app-dropdown-wrapper
        [style.width]="dropdownWidth"
        class="min-w-fit"
        (click)="$event.stopPropagation()"
      >
        <!-- Menu Items -->
        <div class="flex flex-col max-h-[168px] overflow-y-auto gap-2">
          <app-menu-item
            *ngFor="let option of options; trackBy: trackByOption"
            [selected]="option.value === control?.value && !option.disabled"
            (itemClick)="onOptionChange(option)"
          >
            <!-- With icons -->
            <div
              class="flex items-center gap-3 w-full"
              *ngIf="showIcons; else textOnly"
            >
              <!-- Option icon -->
              <!-- Image icon -->
              <img
                *ngIf="option.icon"
                [src]="option.icon"
                [class]="'inline-block rounded-full ' + iconSize"
                [alt]="getOptionDisplayText(option)"
              />
              <!-- CSS class icon -->
              <i
                *ngIf="option.iconClass"
                [class]="option.iconClass + ' ' + iconSize"
              ></i>
              <!-- Placeholder for alignment when no icon -->
              <div
                *ngIf="!option.icon && !option.iconClass"
                [class]="'inline-block ' + iconSize"
              ></div>

              <!-- UPDATED: Use getOptionDisplayText method -->
              <span
                class="text-sm flex-1"
                [ngClass]="{
                  'text-primary-main font-bold':
                    option.value === control?.value && !option.disabled,
                  'text-gray-800':
                    option.value !== control?.value && !option.disabled,
                  'text-gray-400': option.disabled
                }"
              >
                {{ getOptionDisplayText(option) }}
              </span>
            </div>

            <!-- Original text-only template -->
            <ng-template #textOnly>
              <span
                class="text-sm"
                [ngClass]="{
                  'text-primary-main font-bold':
                    option.value === control?.value && !option.disabled,
                  'text-gray-800':
                    option.value !== control?.value && !option.disabled,
                  'text-gray-400': option.disabled
                }"
              >
                {{ getOptionDisplayText(option) }}
              </span>
            </ng-template>
          </app-menu-item>
        </div>
      </app-dropdown-wrapper>
    </app-menu-dropdown>

    <app-loader
      *ngIf="isLoading"
      [inline]="true"
      [size]="'md'"
      class="absolute end-10 top-1/2 transform -translate-y-1/2"
    ></app-loader>
  </div>
</div>

<div *ngIf="hasError && control?.touched" class="text-red text-sm mt-1">
  <ng-container *ngIf="errorMessage">{{
    errorMessage | translate
  }}</ng-container>
</div>
