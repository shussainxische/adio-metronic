<div class="timeline-container bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
  <div class="mb-6">
    <h2 class="text-xl font-semibold text-gray-900 mb-1">{{ title }}</h2>
    <p *ngIf="subtitle" class="text-sm text-gray-600">{{ subtitle }}</p>
  </div>

  <div class="timeline-steps">
    <div 
      *ngFor="let processedStep of processedSteps; let i = index; let last = last" 
      class="timeline-step relative">
      
      <div 
        *ngIf="!last" 
        class="timeline-line absolute left-3 top-8 w-0.5 h-16 bg-gray-200 z-0">
      </div>
      
      <div class="timeline-content flex items-start gap-4 pb-6 relative z-10">
        <div class="timeline-indicator flex-shrink-0 mt-1">
          <div 
            class="w-6 h-6 rounded-full border-2 border-white shadow-sm flex items-center justify-center"
            [class]="getBgColor(processedStep)">
            <svg 
              *ngIf="processedStep.status === 'completed'" 
              class="w-3 h-3 text-white" 
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <div 
              *ngIf="processedStep.status !== 'completed'" 
              class="w-2 h-2 rounded-full bg-white">
            </div>
          </div>
        </div>
        
        <div class="timeline-details flex-1 min-w-0">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-medium text-gray-900 text-base">{{ processedStep.title }}</h3>
              <p class="text-sm text-gray-600 mt-1">{{ processedStep.description }}</p>
            </div>
            <div class="text-right ml-4 flex-shrink-0">
              <p class="text-sm text-gray-500">{{ processedStep.dateRange }}</p>
            </div>
          </div>
          
          <div class="flex items-center gap-2">
            <span 
              class="text-sm font-medium"
              [class]="getStatusColor(processedStep)">
              Duration: {{ processedStep.duration }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
