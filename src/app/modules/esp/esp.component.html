<div class="flex items-center justify-center p-8">
    <div class="max-w-4xl w-full">
      <!-- Header -->
      <div class="text-center mb-12">
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Energy Support Program</h1>
        <p class="text-gray-600">Select your role to access the appropriate dashboard</p>
      </div>

      <!-- Role Cards -->
      <div class="grid md:grid-cols-2 gap-8">
        <!-- Certifying Body Card -->
        <div class="bg-white border-2 border-gray-200 rounded-lg p-8 text-center hover:border-gray-300 cursor-pointer transition-colors"
             (click)="onSelectESP_Role('cb')">
          <h2 class="text-xl font-semibold text-gray-900 mb-4">CERTIFYING BODY</h2>
          <p class="text-gray-600 mb-6">Access certification tools and manage assigned applications</p>
          <button class="bg-gray-900 text-white px-6 py-2 rounded hover:bg-gray-800 transition-colors">
            Enter Dashboard
          </button>
        </div>

        <!-- ADIO Card -->
        <div class="bg-white border-2 border-gray-200 rounded-lg p-8 text-center hover:border-gray-300 cursor-pointer transition-colors"
             (click)="onSelectESP_Role('adio')">
          <h2 class="text-xl font-semibold text-gray-900 mb-4">ADIO</h2>
          <p class="text-gray-600 mb-6">Administrative access to system functions and oversight</p>
          <button class="bg-gray-900 text-white px-6 py-2 rounded hover:bg-gray-800 transition-colors">
            Enter Dashboard
          </button>
        </div>
      </div>
    </div>
  </div>
