<div class="container-fixed space-y-8">
  <app-page-header
    title="Resources"
    subtitle="Access important documents, templates, and training materials">
  </app-page-header>

  <!-- Category Filters -->
  <div class="flex flex-wrap gap-2 mb-6">
    <button
      *ngFor="let category of categories"
      class="px-4 py-2 text-sm rounded-lg border transition-colors"
      [class]="selectedCategory === category.name 
        ? 'ring-2 ring-primary bg-primary text-white' 
        : 'border-gray-300 text-gray-700 hover:bg-gray-50'"
      (click)="filterByCategory(category.name)">
      {{ category.name }} ({{ category.count }})
    </button>
  </div>

  <!-- Resources Grid -->
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    <app-preview-card 
      *ngFor="let resource of filteredResources"
      class="cursor-pointer hover:shadow-lg transition-shadow"
      (click)="downloadResource(resource)">
      
      <div class="mb-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <app-icon 
            [name]="resource.icon" 
            [size]="20" 
            className="text-primary">
          </app-icon>
          <span class="text-xs font-medium px-2 py-1 rounded-full bg-gray-100 text-gray-700">
            {{ resource.category }}
          </span>
        </div>
        <div class="flex items-center gap-1">
          <app-icon 
            [name]="getFileIcon(resource.type)" 
            [size]="16" 
            [className]="getFileTypeColor(resource.type)">
          </app-icon>
          <span class="text-xs text-gray-500">{{ resource.type }}</span>
        </div>
      </div>

      <h3 class="text-lg font-bold text-primary-on-surface mb-2">
        {{ resource.title }}
      </h3>
      
      <p class="text-sm text-gray-600 mb-4">
        {{ resource.description }}
      </p>

      <div class="flex items-center justify-between">
        <span class="text-xs text-gray-500">{{ resource.size }}</span>
        <div class="flex items-center gap-1 text-primary text-sm font-medium">
          <app-icon name="download" [size]="16"></app-icon>
          <span>Download</span>
        </div>
      </div>
    </app-preview-card>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredResources.length === 0" class="text-center py-12">
    <app-icon name="folder" [size]="48" className="text-gray-400 mb-4"></app-icon>
    <h3 class="text-lg font-medium text-gray-900 mb-2">No resources found</h3>
    <p class="text-gray-600">No resources match the selected category.</p>
  </div>
</div>
