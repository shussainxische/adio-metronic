<!-- Investment Section -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-1">{{investmentData.title}}</h3>
  </div>
  <div class="grid grid-cols-2 gap-6">
    <app-input 
      [control]="grossBookValueAbuDhabiControl" 
      [label]="investmentData.fields.grossBookValueAbuDhabi.label" 
      [placeholder]="investmentData.fields.grossBookValueAbuDhabi.placeholder">
    </app-input>
    <app-input 
      [control]="totalGrossBookValueControl" 
      [label]="investmentData.fields.totalGrossBookValue.label" 
      [placeholder]="investmentData.fields.totalGrossBookValue.placeholder">
    </app-input>
  </div>
  <div class="mt-6 grid grid-cols-2 gap-6">
    <app-input-calculated 
      [label]="investmentData.calculatedFields.investmentScore.label" 
      [value]="investmentScore"
      [tooltip]="investmentData.calculatedFields.investmentScore.tooltip">
    </app-input-calculated>
    <app-input-calculated 
      [label]="investmentData.calculatedFields.investmentTopUpScore.label" 
      [value]="investmentTopUpScore"
      [tooltip]="investmentData.calculatedFields.investmentTopUpScore.tooltip">
    </app-input-calculated>
  </div>
</div>

<!-- Manpower & Emiratisation Section -->

  <div class="mt-6 grid grid-cols-2 gap-6">
    <app-input-calculated 
      [label]="manpowerData.calculatedFields.skilledLabourScore.label" 
      [value]="skilledLabourScore"
      [tooltip]="manpowerData.calculatedFields.skilledLabourScore.tooltip">
    </app-input-calculated>
    <div></div>
  </div>
</div>

<!-- Economic Impact Score Summary -->
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-4">
  <div class="mb-6 flex justify-between items-center">
    <h3 class="text-lg font-semibold text-gray-900">{{scoreSummaryData.title}}</h3>
    <div class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-lg">
      {{ totalEconomicImpactScore.toFixed(1) }}
    </div>
  </div>
  
  <div class="economic-score-table">
    <div class="score-table-header">
      <div class="score-header-cell" *ngFor="let header of scoreSummaryData.headers">{{ header }}</div>
    </div>
    
    <div *ngFor="let row of scoreSummaryTableData" class="score-table-row">
      <div class="score-cell-component">{{ row.component }}</div>
      <div class="score-cell-score">{{ row.score }}</div>
      <div class="score-cell-weight">{{ row.weight }}</div>
      <div class="score-cell-result">{{ row.result }}</div>
    </div>
  </div>
</div>
