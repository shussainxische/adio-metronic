<!-- ADIO Read-Only View for Review Applications -->
<div *ngIf="showAdioView">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-4">
    <div class="mb-6">
      <h3 class="text-lg font-semibold text-gray-900 mb-1">EMS/DMS Assessment</h3>
    </div>
    
    <!-- Row 1 -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-semibold text-gray-900 mb-2">Connection Load Meter (MW)</label>
        <p class="text-sm text-gray-700">15.5 MW</p>
        <p class="text-xs text-gray-500 mt-1">Applicable if ≥ 10 MW</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-900 mb-2">EMS Availability</label>
        <p class="text-sm text-gray-700">Available</p>
      </div>
    </div>
    
    <!-- Row 2: Demand Side Consumption with Score -->
    <div class="mt-6 grid grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-semibold text-gray-900 mb-2">Demand Side Consumption (%)</label>
        <p class="text-sm text-gray-700">85% to 89%</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-900 mb-2">DMS Score</label>
        <p class="text-sm text-gray-700">80%</p>
      </div>
    </div>
  </div>
</div>

<!-- CB Interactive View -->
<div *ngIf="!showAdioView">
<div class="section-container">
  <div class="section-header">
    <h3 class="section-title">{{emsData.title}}</h3>
  </div>
  
  <div class="field-grid">
    <app-input-validation
      [control]="connectionLoadMeterControl"
      [label]="emsData.fields.connectionLoadMeter.label"
      [placeholder]="emsData.fields.connectionLoadMeter.placeholder"
      [helperText]="emsData.fields.connectionLoadMeter.helperText"
      [validationRule]="emsData.fields.connectionLoadMeter.validationRule"
      [validationMessage]="emsData.fields.connectionLoadMeter.validationMessage"
      [invalidMessage]="emsData.fields.connectionLoadMeter.invalidMessage"
      [unit]="emsData.fields.connectionLoadMeter.unit">
    </app-input-validation>
    
    <app-input-validation
      [control]="emsAvailabilityControl"
      [label]="emsData.fields.emsAvailability.label"
      [variant]="'dropdown'"
      [options]="emsData.fields.emsAvailability.options"
      [validationRule]="emsData.fields.emsAvailability.validationRule"
      [validationMessage]="emsData.fields.emsAvailability.validationMessage"
      [invalidMessage]="emsData.fields.emsAvailability.invalidMessage">
    </app-input-validation>
  </div>
  
  <div class="consumption-section with-spacing">
    <label class="section-label">{{emsData.fields.demandSideConsumption.label}}</label>
    <div class="horizontal-fields">
      <select 
        class="consumption-dropdown" 
        [formControl]="demandSideConsumptionControl">
        <option value="">{{emsData.fields.demandSideConsumption.placeholder}}</option>
        <option *ngFor="let option of emsData.fields.demandSideConsumption.options" [value]="option.value">
          {{option.label}}
        </option>
      </select>
      
      <app-input-calculated
        variant="blue"
        [label]="emsData.calculatedFields.dmsScore.label"
        [value]="dmsScore"
        [tooltip]="emsData.calculatedFields.dmsScore.tooltip">
      </app-input-calculated>
    </div>
  </div>
</div>
</div>
