<div class="review-stage-container">
  <!-- Multi-Entity Review Status -->
  <div class="section-card">
    <div class="section-header">
      <h3 class="section-title">Multi-Entity Review Status</h3>
    </div>
    
    <div class="entity-cards">
      <div class="entity-card" *ngFor="let entity of entityReviews">
        <div class="entity-info">
          <h4 class="entity-name">{{ entity.name }}</h4>
        </div>
        <div class="entity-status">
          <app-status-badge 
            [text]="getStatusText(entity.status)" 
            [variant]="getStatusVariant(entity.status)" 
            size="sm">
          </app-status-badge>
        </div>
      </div>
    </div>
  </div>

  <!-- Certificate Issuance -->
  <div class="section-card">
    <div class="section-header">
      <h3 class="section-title">Certificate Issuance</h3>
    </div>
    
    
    <!-- Pending Approvals Alert -->
    <div class="alert-card">
      <div class="alert-header">
        <span class="alert-title">Pending Approvals</span>
      </div>
      <p class="alert-message">
        Certificate can only be issued after AD Ports and Final Review complete their review. Initial Review and TAQA Review have already submitted their evaluation.
      </p>
    </div>
  </div>
</div>
