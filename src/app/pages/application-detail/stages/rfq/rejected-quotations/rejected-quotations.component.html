<div *ngIf="rejectedQuotations.length > 0" class="mb-4">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <div class="mb-6">
      <h3 class="text-lg font-semibold text-gray-900 mb-1">Not Awarded</h3>
    </div>
    
    <!-- Tiny Table Headers -->
    <div class="flex items-center py-2 border-b border-gray-200 mb-3 gap-4">
      <div class="w-8"></div> <!-- Status column -->
      <div class="min-w-0 flex-1 flex gap-3">
        <div class="text-xs text-gray-500 font-medium flex-1">Certifying Body</div>
        <div class="text-xs text-gray-500 font-medium w-20">Amount</div>
      </div>
      <div class="min-w-[100px] text-xs text-gray-500 font-medium">Submitted On</div>
      <div class="w-36 text-xs text-gray-500 font-medium">Actions</div>
    </div>
    
    <div class="space-y-3">
      <div *ngFor="let rejected of rejectedQuotations" class="flex items-center py-3 border-b border-gray-100 last:border-b-0 gap-4">
        <!-- Status Icon -->
        <div class="w-8 flex justify-center">
          <span *ngIf="rejected.status === 'submitted'" 
                class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-green-100">
            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </span>
          <span *ngIf="rejected.status === 'pending'" 
                class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-yellow-100">
            <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
          </span>
        </div>
        
        <!-- CB Name and Amount aligned with headers -->
        <div class="min-w-0 flex-1 flex gap-3">
          <div class="text-sm text-gray-900 flex-1">
            {{ rejected.cbName }}
          </div>
          <div class="text-sm w-20">
            <span *ngIf="rejected.status === 'submitted'" class="text-gray-900">{{ rejected.amount }}</span>
            <span *ngIf="rejected.status === 'pending'" class="text-gray-500">-</span>
          </div>
        </div>
        
        <!-- Submitted Date -->
        <div class="min-w-[100px]">
          <span *ngIf="rejected.status === 'submitted'" class="text-xs text-gray-600">{{ rejected.submissionDate }}</span>
          <span *ngIf="rejected.status === 'pending'" class="text-xs text-orange-600">Not Submitted</span>
        </div>
        
        <!-- Actions -->
        <div class="w-36">
          <button *ngIf="rejected.status === 'submitted'"
                  (click)="viewProposal(rejected.cbName)"
                  class="w-36 flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs bg-white border border-gray-300 text-black rounded-md hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Download
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
