<div class="min-h-screen bg-gray-50">
  <div class="flex">
    <div class="flex-1 mr-96 bg-gray-50">
      <div class="container-fixed">
        <app-button 
          (click)="goBack()"
          className="flex items-center gap-2 text-gray-600 hover:text-gray-800 my-4 bg-transparent border-none p-0">
          <app-icon name="arrow-left" [size]="16"></app-icon>
          <span class="text-sm font-medium">Back to Applications</span>
        </app-button>
        
        <!-- Separator -->
        <div class="border-b border-gray-200 mb-3"></div>

        <!-- Stage Tabs -->
        <div>
          <app-tab-navigation
            [tabs]="stageTabs"
            [activeTabId]="currentStage"
            (tabSelected)="onStageChange($event)">
          </app-tab-navigation>
        </div>

        <!-- Step Content -->
        <div *ngIf="currentStageData" class="bg-white rounded-lg shadow-sm border border-gray-200">
          
          <!-- Step Progress - Inside Container -->
          <div *ngIf="hasMultipleSteps" class="bg-gray-50 border-b border-gray-200 px-6 py-4">
            <div class="flex items-center flex-wrap text-sm">
              <span *ngFor="let step of currentStageSteps; let i = index; let last = last" 
                    class="flex items-center">
                
                <!-- Step Name -->
                <span 
                  [class]="getContainerStepClasses(i)"
                  [style.cursor]="canAccessStep(i) ? 'pointer' : 'not-allowed'"
                  (click)="onStepClick(i)">
                  {{ step.label }}
                </span>
                
                <!-- Chevron Arrow -->
                <app-icon 
                  *ngIf="!last"
                  name="chevron-right" 
                  [size]="14"
                  className="mx-2 text-gray-500">
                </app-icon>
              </span>
            </div>
          </div>

          <!-- Step Content Area -->
          <div class="p-6">
            <div class="min-h-[400px] flex items-center justify-center">
              <div class="text-center">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <app-icon name="file-text" [size]="32" className="text-gray-400"></app-icon>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ currentStepData?.name }}</h3>
                <p class="text-gray-600 max-w-md">
                  {{ currentStepData?.description }}
                </p>
                <p class="text-sm text-gray-500 mt-4">
                  Content for this step will be implemented based on specific requirements.
                </p>
              </div>
            </div>
          </div>

          <!-- Step Navigation -->
          <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <button 
                *ngIf="showPreviousStepButton"
                (click)="previousStep()"
                class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 flex items-center gap-1">
                <app-icon name="chevron-left" [size]="16"></app-icon>
                Previous Step
              </button>
              <button 
                *ngIf="showPreviousStageButton"
                (click)="previousStage()"
                class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 flex items-center gap-1">
                <app-icon name="chevron-left" [size]="16"></app-icon>
                Previous Stage
              </button>
            </div>

            <div class="flex items-center gap-2">
              <button 
                *ngIf="showNextStepButton"
                (click)="nextStep()"
                class="px-4 py-2 text-sm font-medium bg-primary text-white rounded-lg hover:bg-primary-active flex items-center gap-1">
                Next Step
                <app-icon name="chevron-right" [size]="16"></app-icon>
              </button>
              <button 
                *ngIf="showNextStageButton"
                (click)="nextStage()"
                class="px-4 py-2 text-sm font-medium bg-primary text-white rounded-lg hover:bg-primary-active flex items-center gap-1">
                Next Stage
                <app-icon name="chevron-right" [size]="16"></app-icon>
              </button>
              <button 
                *ngIf="showCompleteButton"
                class="px-4 py-2 text-sm font-medium bg-green text-white rounded-lg hover:bg-green-600">
                Complete Application
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <app-sidebar position="right" width="w-96">
      <app-summary-widget [data]="summaryData"></app-summary-widget>
      <app-applicant-contact-widget [data]="contactData"></app-applicant-contact-widget>
      <app-sla-compliance-widget [data]="slaData"></app-sla-compliance-widget>
    </app-sidebar>
  </div>
</div>
