<div class="container-fixed">
  <div class="flex flex-wrap items-center lg:items-end justify-between gap-5 pb-7.5">
    <div class="flex flex-col justify-center gap-2">
      <h1 class="text-xl font-semibold leading-none text-gray-900">
        ESP Applications
      </h1>
      <div class="flex items-center gap-2 text-sm font-medium text-gray-600">
        Manage and track all ESP application types
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 lg:gap-7.5">
    <app-top-card 
      *ngFor="let appType of applicationTypes" 
      [title]="appType.name"
      [mainValue]="getApplicationCount(appType.name).toString()"
      [statusText]="appType.name === 'RFQ' ? '1 Overdue' : ''"
      [showIcon]="true"
      [className]="'cursor-pointer hover:shadow-lg transition-all duration-300 w-full ' + (isFilterActive(appType.name) ? 'ring-2 ring-blue-500 shadow-lg' : '')"
      [showShadow]="true"
      (click)="filterApplications(appType.name)">
    </app-top-card>
  </div>

  <!-- Filter tabs section -->
  <div class="flex items-center gap-4 mt-12 mb-6">
    <button 
      (click)="filterApplications('All')"
      [ngClass]="{
        'bg-gray-100 text-gray-900 border-b-2 border-blue-600': selectedFilter === 'All',
        'text-gray-600 hover:text-gray-900': selectedFilter !== 'All'
      }"
      class="px-4 py-2 rounded-lg font-medium transition-all duration-200">
      All Applications ({{ getApplicationCount('All') }})
    </button>
    <button 
      *ngFor="let appType of applicationTypes"
      (click)="filterApplications(appType.name)"
      [ngClass]="{
        'bg-gray-100 text-gray-900 border-b-2 border-blue-600': selectedFilter === appType.name,
        'text-gray-600 hover:text-gray-900': selectedFilter !== appType.name
      }"
      class="px-4 py-2 rounded-lg font-medium transition-all duration-200">
      {{ appType.name }} ({{ getApplicationCount(appType.name) }})
    </button>
    <div class="ml-auto flex items-center gap-2">
      <span class="text-sm text-gray-600">Showing: {{ filteredApplications.length }} applications</span>
    </div>
  </div>

  <!-- Individual application cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-preview-card 
      *ngFor="let app of filteredApplications" 
      [className]="'h-full transition-all duration-300 hover:shadow-xl'"
      [showShadow]="true">
      
      <div class="flex flex-col h-full">
        <!-- Status badge -->
        <div class="mb-4">
          <span class="inline-flex px-3 py-1 text-xs font-medium rounded-full"
                [ngClass]="{
                  'bg-yellow-100 text-yellow-800': app.status === 'Pending',
                  'bg-green-100 text-green-800': app.status === 'Completed'
                }">
            {{ app.type }} - {{ app.status }}
          </span>
        </div>

        <!-- Application ID -->
        <h3 class="text-lg font-bold text-gray-900 mb-2">{{ app.id }}</h3>

        <!-- Company name -->
        <p class="text-sm text-gray-600 mb-4 flex-grow">{{ app.companyName }}</p>

        <!-- Progress section -->
        <div class="mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-medium text-gray-600">E</span>
            <span class="text-xs font-medium text-gray-600">G</span>
          </div>
          
          <!-- Progress bar -->
          <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
            <div class="bg-green-500 h-2 rounded-full" [style.width.%]="app.progress"></div>
          </div>
          
          <div class="flex justify-between items-center">
            <span class="text-xs text-gray-500">{{ app.date }}</span>
            <span class="text-sm font-medium text-gray-900">{{ app.progress }}%</span>
          </div>
        </div>

        <!-- Action button -->
        <button class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm py-2 px-4 rounded-lg transition-colors duration-200 flex items-center justify-between">
          <span>{{ app.actionLabel }}</span>
          <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
        </button>
      </div>
    </app-preview-card>
  </div>
</div>
