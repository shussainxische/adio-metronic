<div class="container-fixed space-y-8">
  <!-- Page Header -->
  <app-page-header
    title="ESP Applications"
    subtitle="Manage and track all ESP application types">
  </app-page-header>

  <!-- Application Type Cards -->
  <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-top-card
      *ngFor="let appType of applicationTypes"
      [active]="isFilterActive(appType.name)"
      (click)="filterApplications(appType.name)">
      
      <div class="flex items-center justify-between mb-4">
        <span class="text-gray-600 text-2sm">{{ appType.name }}</span>
        <app-icon name="mail" [size]="20" className="text-gray-400"></app-icon>
      </div>

      <div class="flex items-end justify-between">
        <span class="text-3xl font-bold text-primary-on-surface">
          {{ getApplicationCount(appType.name) }}
        </span>
        
        <div *ngIf="appType.name === 'RFQ'" class="flex items-center text-red text-2sm">
          <app-icon name="alert-circle" [size]="16" className="mr-1"></app-icon>
          1 Overdue
        </div>
      </div>
    </app-top-card>
  </div>

  <!-- Filter Tabs -->
  <app-filter-tabs
    [tabs]="filterTabs"
    [selectedTab]="selectedFilter"
    [countLabel]="resultCountLabel"
    (tabChanged)="filterApplications($event)">
  </app-filter-tabs>

  <!-- Application Cards -->
  <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-preview-card *ngFor="let app of filteredApplications">
      
      <!-- Status Badge -->
      <div class="mb-4">
        <app-status-badge
          [text]="getBadgeText(app.type, app.status)"
          [variant]="getStatusVariant(app.status)"
          size="sm"
          [autoWidth]="true">
        </app-status-badge>
      </div>

      <!-- Application ID -->
      <h3 class="text-2sm font-bold text-primary-on-surface mb-4">{{ app.id }}</h3>

      <!-- Company Info -->
      <h4 class="text-2sm font-bold text-primary-on-surface mb-1">{{ app.companyName }}</h4>
      <p class="text-2xs text-gray-700 mb-6">{{ app.companyType || 'Renewal' }}</p>

      <!-- Category Badge -->
      <div class="mb-6">
        <app-status-badge
          [text]="getCategoryInitial(app.category || 'Electricity')"
          variant="category"
          size="xs">
        </app-status-badge>
      </div>

      <!-- Progress Bar -->
      <div class="mb-6">
        <app-progress-bar
          [progress]="app.progress"
          [deadline]="'Deadline: ' + (app.deadline || app.date)"
          [urgent]="true">
        </app-progress-bar>
      </div>

      <!-- Footer -->
      <app-application-footer
        [certifyingBody]="app.certifyingBody || 'Abu Dhabi Certification Body'"
        [showAlert]="app.type === 'RFQ'">
      </app-application-footer>
    </app-preview-card>
  </div>
</div>
