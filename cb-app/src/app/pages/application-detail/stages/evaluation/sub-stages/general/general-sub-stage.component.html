<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-1">Application Details</h3>
  </div>
  <div class="grid grid-cols-2 gap-6">
    <div>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Application Type</label>
      <div class="text-gray-700">Renewal</div>
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Utilities Required</label>
      <div class="flex gap-2 flex-wrap">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200">Electricity</span>
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200">Gas</span>
      </div>
    </div>
  </div>
  <div class="mt-6 grid grid-cols-2 gap-6">
    <div>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Financial Year End Date</label>
      <div class="text-gray-700">31 Dec 2025</div>
    </div>
    <div></div>
  </div>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-4">
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-1">Past Renewals</h3>
    <p class="text-sm text-gray-600">View and download certificates from previous renewals</p>
  </div>

  <!-- Certificate Files -->
  <div class="certificate-files-container">
    <div 
      *ngFor="let doc of viewFileData" 
      class="certificate-file-item"
      (click)="downloadCertificate(doc)">
      <div class="certificate-file-content">
        <div class="certificate-file-icon">
          <app-icon name="file-text" [size]="16" className="text-red-600"></app-icon>
        </div>
        <div class="certificate-file-name">
          {{ doc.fileName }}
        </div>
      </div>
      <div class="certificate-download-icon">
        <app-icon name="download" [size]="12" className="text-gray-500"></app-icon>
      </div>
    </div>
  </div>
</div>
