<!-- Editable Application Details Section -->
<div *ngIf="!readOnly" class="section-container">
  <div class="section-header">
    <h3 class="section-title">{{applicationDetailsData.title}}</h3>
  </div>
  <div class="field-grid">
    <app-input 
      [control]="applicationTypeControl" 
      [label]="applicationDetailsData.fields.applicationType.label">
    </app-input>
    <div class="form-field">
      <label class="field-label">{{applicationDetailsData.fields.utilitiesRequired.label}}</label>
      <div class="utilities-checkboxes">
        <label *ngFor="let utility of applicationDetailsData.fields.utilitiesRequired.options" class="checkbox-item">
          <input type="checkbox" [value]="utility.value" class="checkbox-input">
          <span class="checkbox-label">{{utility.label}}</span>
        </label>
      </div>
    </div>
  </div>
  <div class="field-grid with-spacing">
    <app-input 
      [control]="financialYearEndDateControl" 
      [label]="applicationDetailsData.fields.financialYearEndDate.label"
      [placeholder]="applicationDetailsData.fields.financialYearEndDate.placeholder"
      type="date">
    </app-input>
    <div></div>
  </div>
</div>

<!-- Read-Only Application Details Section -->
<div *ngIf="readOnly" class="section-container">
  <div class="section-header">
    <h3 class="section-title">{{applicationDetailsData.title}}</h3>
  </div>
  <div class="field-grid">
    <div class="form-field">
      <label class="field-label">{{applicationDetailsData.fields.applicationType.label}}</label>
      <div class="field-value">{{applicationTypeControl.value}}</div>
    </div>
    <div class="form-field">
      <label class="field-label">{{applicationDetailsData.fields.utilitiesRequired.label}}</label>
      <div class="field-value">
        <span *ngFor="let utility of utilitiesRequiredControl.value; let last = last" 
              class="utility-badge">
          {{utility}}{{!last ? ', ' : ''}}
        </span>
      </div>
    </div>
  </div>
  <div class="field-grid with-spacing">
    <div class="form-field">
      <label class="field-label">{{applicationDetailsData.fields.financialYearEndDate.label}}</label>
      <div class="field-value">{{financialYearEndDateControl.value | date:'dd MMM yyyy'}}</div>
    </div>
    <div></div>
  </div>
</div>

<!-- Past Renewals Section (same for both editable and read-only) -->
<div class="section-container">
  <div class="section-header">
    <h3 class="section-title">Past Renewals</h3>
    <p class="text-sm text-gray-600">View and download certificates from previous renewals</p>
  </div>

  <!-- Certificate Files -->
  <div class="certificate-files-container">
    <div 
      *ngFor="let doc of viewFileData" 
      class="certificate-file-item"
      (click)="downloadCertificate(doc)">
      <div class="certificate-file-content">
        <div class="certificate-file-icon">
          <app-icon name="file-text" [size]="16" className="text-red-600"></app-icon>
        </div>
        <div class="certificate-file-name">
          {{ doc.fileName }}
        </div>
      </div>
      <div class="certificate-download-icon">
        <app-icon name="download" [size]="12" className="text-gray-500"></app-icon>
      </div>
    </div>
  </div>
</div>
